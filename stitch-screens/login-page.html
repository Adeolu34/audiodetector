<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#bec4f2",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#713700",
                        "secondary-container": "#c9cffd",
                        "on-surface": "#1a1b22",
                        "on-primary-fixed-variant": "#293ca0",
                        "on-primary-fixed": "#00105c",
                        "error": "#ba1a1a",
                        "surface-tint": "#4355b9",
                        "outline": "#757684",
                        "on-tertiary-fixed": "#301400",
                        "primary-container": "#3f51b5",
                        "tertiary-container": "#8f4700",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdcc6",
                        "primary-fixed": "#dee0ff",
                        "surface-container": "#efedf6",
                        "on-secondary-fixed": "#12183d",
                        "secondary": "#565c84",
                        "outline-variant": "#c5c5d4",
                        "surface-container-low": "#f4f2fc",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb784",
                        "background": "#fbf8ff",
                        "inverse-surface": "#2f3037",
                        "inverse-primary": "#bac3ff",
                        "on-surface-variant": "#454652",
                        "on-primary-container": "#cacfff",
                        "surface-container-highest": "#e3e1ea",
                        "surface": "#fbf8ff",
                        "inverse-on-surface": "#f2eff9",
                        "on-secondary-fixed-variant": "#3e446b",
                        "on-secondary-container": "#51577f",
                        "on-error-container": "#93000a",
                        "surface-dim": "#dbd9e2",
                        "primary": "#24389c",
                        "surface-container-high": "#e9e7f0",
                        "on-tertiary-container": "#ffc7a2",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#bac3ff",
                        "secondary-fixed": "#dee0ff",
                        "tertiary": "#6c3400",
                        "on-background": "#1a1b22",
                        "surface-bright": "#fbf8ff",
                        "surface-variant": "#e3e1ea"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-mesh {
            background-color: #fbf8ff;
            background-image: 
                radial-gradient(at 0% 0%, rgba(63, 81, 181, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(36, 56, 156, 0.08) 0px, transparent 50%);
        }
        .glass-effect {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-mesh font-body text-on-surface min-h-screen flex flex-col">
<!-- Linear Process Header (TopNavBar Hidden for Focus) -->
<header class="w-full p-8 flex justify-between items-center absolute top-0 left-0">
<div class="flex items-center gap-3">
<div class="bg-primary p-2 rounded-xl">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<span class="font-headline font-bold text-xl tracking-tight text-primary">Chatbot AI</span>
</div>
<div>
<span class="text-on-surface-variant text-sm font-label">Don't have an account?</span>
<a class="ml-2 text-primary font-semibold text-sm hover:underline" href="#">Sign Up</a>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-4 py-20">
<div class="w-full max-w-[440px]">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant/15 rounded-[2rem] p-8 md:p-10">
<div class="mb-10 text-center">
<h1 class="font-headline text-3xl font-extrabold text-on-surface mb-2">Welcome Back</h1>
<p class="text-on-surface-variant text-body-lg">Continue your intelligent dialogue</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant/50">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-surface-container-high border-0 rounded-full focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline/50 text-on-surface" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block text-sm font-medium text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant/50">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-surface-container-high border-0 rounded-full focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline/50 text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant/50 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Log In Button -->
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold rounded-full shadow-lg shadow-primary/10 hover:opacity-95 transform active:scale-[0.98] transition-all flex justify-center items-center gap-2 mt-4" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-sm uppercase">
<span class="bg-surface-container-lowest px-4 text-outline font-semibold tracking-widest text-[10px]">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant/30 rounded-full hover:bg-surface-container-low transition-colors group">
<img alt="" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA22qtmIZ-gtX5BQd_LG9Udw3Izspnr7LK46bG0GezZHVvegLTQUntpBP7kiGF1am8iGGIwvsYnnf1m6FtwRHPkid9ojeJif3eARkypS0-wRgd1YhCV-RSDcqz8hwpQC5EcOCChnXOM457XQu6O0B_m7sPtM7PZShn5YqiUquGZ9lFM7E5isXLiYcVzSJfRCE9xPFctnHaRz8kIiZxQTDr1Z8BMs1QuRRJ4uKJw3j1shA7Mfeka9BxYs_xEDXH2VAisysOOm7s5Xt8"/>
<span class="text-sm font-semibold text-on-surface-variant group-hover:text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant/30 rounded-full hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-[22px] text-on-surface" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="text-sm font-semibold text-on-surface-variant group-hover:text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Context Footer -->
<div class="mt-12 flex justify-center gap-8 text-on-surface-variant/40 text-[11px] font-semibold tracking-wider uppercase">
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Contact Support</a>
</div>
</div>
</main>
<!-- Visual Accent Element (Editorial Scale) -->
<div class="fixed bottom-[-10%] right-[-5%] opacity-[0.03] pointer-events-none select-none">
<span class="font-headline text-[25rem] font-black leading-none text-primary">AI</span>
</div>
</body></html>
