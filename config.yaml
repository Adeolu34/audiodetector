audio:
  sample_rate: 22050
  duration: 5.0
  n_mels: 128
  n_fft: 2048
  hop_length: 512

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 15
  class_caps:
    bird: 1000

data:
  data_dir: data/organized
  checkpoint_dir: checkpoints

model:
  type: resnet18        # "resnet18" or "cnn"
  pretrained: true      # ResNet only, ImageNet weights
  dropout: 0.2          # CNN only
  fc_dropout: 0.3       # CNN only

feedback:
  feedback_dir: data/feedback
  fine_tune_epochs: 10
  fine_tune_lr: 0.0001
  min_feedback: 5
  freeze_conv_blocks: 2
